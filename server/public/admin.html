<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>跑步打卡管理端</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f6f8fa; color: #111827; }
    .container { max-width: 960px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    .card { background: #fff; border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    input, button { font-size: 14px; }
    input { padding: 10px 12px; border: 1px solid #d0d7de; border-radius: 10px; width: 280px; }
    button { padding: 10px 16px; border: none; border-radius: 10px; background: #2563eb; color: #fff; cursor: pointer; font-weight: 600; }
    button.secondary { background: #e5e7eb; color: #111827; }
    button.danger { background: #b42318; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #eef2f7; font-size: 14px; }
    th { color: #667; font-weight: 600; }
    .stats { display: flex; gap: 12px; flex-wrap: wrap; }
    .stat { flex: 1; min-width: 140px; background: #f8fafc; border-radius: 12px; padding: 14px; }
    .stat .label { color: #667; font-size: 13px; }
    .stat .value { font-size: 22px; font-weight: 800; margin-top: 4px; }
    .muted { color: #667; font-size: 13px; }
    .error { color: #b42318; margin-top: 8px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>跑步打卡管理端</h1>

    <div class="card">
      <div class="row">
        <input id="token" type="password" placeholder="管理端令牌 ADMIN_TOKEN" />
        <button onclick="loadAll()">登录并加载</button>
      </div>
      <div id="authError" class="error"></div>
    </div>

    <div class="card" id="statsCard" style="display:none;">
      <div class="stats" id="stats"></div>
    </div>

    <div class="card" id="usersCard" style="display:none;">
      <h2 style="font-size:18px;margin:0 0 8px;">注册用户</h2>
      <p class="muted">密码为 bcrypt 哈希存储，无法查看明文；可通过“重置密码”设置新密码。</p>
      <div id="usersTable"></div>
    </div>

    <div class="card" id="runsCard" style="display:none;">
      <h2 style="font-size:18px;margin:0 0 8px;">最近跑步记录</h2>
      <div id="runsTable"></div>
    </div>
  </div>

<script>
  let adminToken = '';

  function api(path, options = {}) {
    return fetch(path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'x-admin-token': adminToken,
        ...(options.headers || {}),
      },
    }).then(async (res) => {
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '请求失败');
      return data;
    });
  }

  async function loadAll() {
    adminToken = document.getElementById('token').value.trim();
    document.getElementById('authError').textContent = '';
    try {
      const [stats, users, runs] = await Promise.all([
        api('/api/admin/stats'),
        api('/api/admin/users'),
        api('/api/admin/runs'),
      ]);
      renderStats(stats);
      renderUsers(users.users);
      renderRuns(runs.runs);
      document.getElementById('statsCard').style.display = 'block';
      document.getElementById('usersCard').style.display = 'block';
      document.getElementById('runsCard').style.display = 'block';
    } catch (error) {
      document.getElementById('authError').textContent = error.message;
    }
  }

  function renderStats(stats) {
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="label">用户数</div><div class="value">${stats.userCount}</div></div>
      <div class="stat"><div class="label">跑步次数</div><div class="value">${stats.runCount}</div></div>
      <div class="stat"><div class="label">累计距离</div><div class="value">${(stats.totalDistanceMeters / 1000).toFixed(2)} km</div></div>
      <div class="stat"><div class="label">累计时长</div><div class="value">${Math.round(stats.totalDurationSeconds / 60)} 分钟</div></div>
    `;
  }

  function renderUsers(users) {
    if (!users.length) {
      document.getElementById('usersTable').innerHTML = '<p class="muted">暂无用户</p>';
      return;
    }
    document.getElementById('usersTable').innerHTML = `
      <table>
        <thead><tr><th>用户名</th><th>邮箱</th><th>注册时间</th><th>跑步次数</th><th>累计距离</th><th>操作</th></tr></thead>
        <tbody>
          ${users.map((u) => `
            <tr>
              <td>${u.username}</td>
              <td>${u.email || '-'}</td>
              <td>${new Date(u.createdAt).toLocaleString()}</td>
              <td>${u.runCount}</td>
              <td>${(u.totalDistanceMeters / 1000).toFixed(2)} km</td>
              <td><button class="secondary" onclick="resetPassword('${u.id}','${u.username}')">重置密码</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  function renderRuns(runs) {
    if (!runs.length) {
      document.getElementById('runsTable').innerHTML = '<p class="muted">暂无跑步记录</p>';
      return;
    }
    document.getElementById('runsTable').innerHTML = `
      <table>
        <thead><tr><th>用户ID</th><th>开始时间</th><th>距离</th><th>时长</th><th>轨迹点</th></tr></thead>
        <tbody>
          ${runs.slice(0, 50).map((r) => `
            <tr>
              <td>${r.userId}</td>
              <td>${new Date(r.startedAt).toLocaleString()}</td>
              <td>${(r.distanceMeters / 1000).toFixed(2)} km</td>
              <td>${Math.round(r.durationSeconds / 60)} 分钟</td>
              <td>${(r.points || []).length}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  async function resetPassword(userId, username) {
    const password = prompt(`为用户 ${username} 设置新密码（至少 6 位）：`);
    if (!password) return;
    try {
      await api(`/api/admin/users/${userId}/reset-password`, {
        method: 'POST',
        body: JSON.stringify({ password }),
      });
      alert('密码已重置');
    } catch (error) {
      alert(error.message);
    }
  }
</script>
</body>
</html>
